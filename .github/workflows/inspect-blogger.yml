name: Inspect Blogger pages (read-only, temporary)
on:
  push:
    branches: [main]
    paths: ["tools/inspect-trigger.txt"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Inspect
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: node tools/inspect-blogger.js
      - name: Save report to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/blogger-inspect.json
          git commit -m "Blogger inspect report (read-only check)" || exit 0
          git pull --rebase origin main
          git push
