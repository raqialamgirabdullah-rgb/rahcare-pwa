<i data-rc-hide-chrome="2" hidden></i><link rel="stylesheet" href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css?v=19"><style>.signup-title{color:var(--primary);text-align:center;margin:0 0 20px;font-size:22px;font-weight:600}.pass-group{position:relative!important;display:flex!important;align-items:center!important}.pass-group input{padding-right:40px!important;width:100%!important;box-sizing:border-box!important}.eye-icon{position:absolute!important;right:12px!important;cursor:pointer!important;color:var(--text-muted);z-index:100!important;user-select:none!important;font-size:16px;display:flex!important;align-items:center!important;justify-content:center!important;height:100%!important}.login-link{text-align:center;color:var(--text-sub);margin-top:15px;font-size:14px}.login-link a{color:var(--primary);font-weight:600;text-decoration:none}#addrBtn{padding:0 10px}#addrBtn input,.mgmt-inline{color:var(--text-main);cursor:pointer}#addrBtn input{border:none;outline:0;background:0 0;width:100%;height:100%;padding:0;font-size:12px}#addrBtn input::placeholder{color:#aaa}.otype-wrap{position:relative}.otype-wrap .rc-dd-btn{padding-right:110px}.mgmt-inline{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:80px;height:28px;box-sizing:border-box;padding:2px 6px;font-size:10px;line-height:1.15;background:#fafafa;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;border-radius:var(--radius-sm);word-break:keep-all}.mgmt-inline.selected{background:#fff;border-color:var(--primary);color:var(--primary)}#mgmtVal{display:block;white-space:normal}.mgmt-inline .rc-dd-menu{width:120px;left:auto;right:0;top:32px}</style><div class="rc-card" style="max-width:340px"><h2 class="signup-title">🌿 Join Rah Now!</h2><form autocomplete="off" onsubmit="handleSignup(event)"><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Organization Name</label> <input placeholder="Enter organization name" autocomplete="off" class="rc-input" id="fname" required></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Organization Type</label><div class="rc-dd otype-wrap" id="otypeDD"><div class="rc-dd-btn" id="otypeBtn" onclick='window.otypeSingleClick()' ondblclick='window.otypeDoubleClick()'><span id="otypeVal">Enter Organization Type</span></div><div class="rc-dd-menu rc-dd-grid" id="otypeMenu"><span data-val="Ruqyah & Hijama" onclick='pickChip("otype","Ruqyah & Hijama")'>Ruqyah & Hijama</span><span data-val="Ruqyah" onclick='pickChip("otype","Ruqyah")'>Ruqyah</span><span data-val="Hijama" onclick='pickChip("otype","Hijama")'>Hijama</span><span data-val="Garments" onclick='pickChip("otype","Garments")'>Garments</span><span data-val="School" onclick='pickChip("otype","School")'>School</span><span data-val="Travel Agency" onclick='pickChip("otype","Travel Agency")'>Travel Agency</span></div><div class="rc-dd mgmt-inline selected" id="mgmtDD"><span id="mgmtVal" onclick='openDD("mgmtMenu")'>Patient Management</span><div class="rc-dd-menu" id="mgmtMenu"><span data-val="patient" onclick='pickChip("mgmt","Patient Management","patient")'>Patient Management</span><span data-val="worker" onclick='pickChip("mgmt","Worker Management","worker")'>Worker Management</span><span data-val="student" onclick='pickChip("mgmt","Student Management","student")'>Student Management</span><span data-val="client" onclick='pickChip("mgmt","Client Management","client")'>Client Management</span><span data-val="staff" onclick='pickChip("mgmt","Staff Management","staff")'>Staff Management</span></div></div></div></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Branch Phone</label><input placeholder="Enter your phone number" autocomplete="off" class="rc-input" id="phone" minlength="7" maxlength="15" required type="tel"></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Email</label> <input placeholder="Email address" autocomplete="off" class="rc-input" id="email" required type="email"></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Password</label><div class="pass-group"><input placeholder="Min 8 characters" autocomplete="off" class="rc-input" id="signup-pass" minlength="8" required type="password"> <span onclick='togglePass("signup-pass",this)' class="eye-icon">👁</span></div></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Branch District</label><div class="rc-dd" id="addrDD"><div class="rc-dd-btn" id="addrBtn"><input type="text" id="addrVal" placeholder="Select District" autocomplete="off" readonly="readonly" onclick='openDD("addrMenu")'></div><div class="rc-dd-menu" id="addrMenu"></div></div></div><div class="form-group" style="margin-bottom:15px"><label class="rc-label">Exact Branch Address</label> <input placeholder="Enter your exact branch address" autocomplete="off" class="rc-input" id="bdate" required></div><button class="rc-btn rc-btn-primary" style="width:100%">Register</button></form><div class="login-link">Already have an account? <a href="https://rahcare.blogspot.com/p/login.html">Sign in</a></div></div><script type="module">import{db,auth,togglePasswordVisibility,autoClearAuthForm,initDropdowns,toggleDropdown,fetchAddressData,initAddressDropdown}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=14";import{doc,setDoc}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";import{createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";let selectedDivision="",selectedDistrict="",selectedArea="",chips={otype:{label:"",val:""},mgmt:{label:"Patient Management",val:"patient"}};const chipEl={otype:{btn:"otypeBtn",val:"otypeVal",menu:"otypeMenu"},mgmt:{btn:"mgmtDD",val:"mgmtVal",menu:"mgmtMenu"}};autoClearAuthForm();initDropdowns(".rc-dd",".rc-dd-menu");window.togglePass=(e,t)=>togglePasswordVisibility(e,t);window.openDD=e=>toggleDropdown(document.getElementById(e));let otypeClickTimer=null;window.otypeSingleClick=()=>{otypeClickTimer=setTimeout(()=>{openDD("otypeMenu");otypeClickTimer=null},220)};window.otypeDoubleClick=()=>{if(otypeClickTimer){clearTimeout(otypeClickTimer);otypeClickTimer=null}document.getElementById("otypeMenu").classList.remove("open");enterOtypeEdit()};function enterOtypeEdit(){const val=document.getElementById("otypeVal");const input=document.createElement("input");input.type="text";input.id="otypeVal";input.style.cssText="border:none;outline:0;background:0 0;width:100%;height:100%;padding:0;font-size:13px;font-family:inherit";input.value=chips.otype.val||"";val.replaceWith(input);input.focus();input.addEventListener("blur",()=>{const t=input.value.trim();const span=document.createElement("span");span.id="otypeVal";if(t){chips.otype={label:t,val:t};span.textContent=t;document.getElementById("otypeBtn").classList.add("selected")}else{chips.otype={label:"",val:""};span.textContent="Enter Organization Type";document.getElementById("otypeBtn").classList.remove("selected")}input.replaceWith(span)});input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();input.blur()}})}window.pickChip=(e,t,n)=>{n=n||t;chips[e]={label:t,val:n};const r=chipEl[e];document.getElementById(r.val).textContent=t;document.getElementById(r.btn).classList.add("selected");document.querySelectorAll("#"+r.menu+" span").forEach(e=>e.classList.toggle("checked",e.dataset.val===n));window.openDD(r.menu)};(async()=>{try{const e=await fetchAddressData();initAddressDropdown({menuId:"addrMenu",btnId:"addrBtn",valueId:"addrVal",addressData:e,onSelect:(e,t,n)=>{selectedDivision=e,selectedDistrict=t,selectedArea=n||""}})}catch(e){console.error("Error loading address data:",e)}})();window.handleSignup=e=>{e.preventDefault();const t=document.getElementById("fname").value.trim(),n=chips.otype.val,r=document.getElementById("phone").value.trim(),o=document.getElementById("email").value.trim(),a=document.getElementById("signup-pass").value,i=document.getElementById("bdate").value.trim();if(!chips.otype.val)return alert("Organization Type লিখুন বা সিলেক্ট করুন!");if(!selectedDistrict)return alert("Branch district সিলেক্ট করুন!");const s=selectedDistrict+" Branch";createUserWithEmailAndPassword(auth,o,a).then(e=>{const a=e.user.uid;return["uid","userId","user_id"].forEach(k=>localStorage.setItem(k,a)),setDoc(doc(db,"users",a),{uid:a,centreName:t,centreType:n,managementType:chips.mgmt.val,branchName:s,branchAddress:i,branchNumber:r,email:o,createdAt:(new Date).toISOString()})}).then(()=>{alert("Registration Successful!"),window.location.href="https://rahcare.blogspot.com/p/login.html"}).catch(e=>alert("Error: "+e.message))};</script>
