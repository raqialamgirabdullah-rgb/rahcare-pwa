<link href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css" rel="stylesheet"><script>addEventListener("pageshow",e=>e.persisted&&location.reload())</script><style>body{background:var(--bg);margin:0;padding:10px;font-family:var(--font-main)}.profile-box{background:var(--card-bg);border-radius:8px;max-width:350px;margin:auto;padding:20px;box-shadow:var(--shadow-card)}.profile-title{color:var(--primary);border-bottom:2px solid var(--border-light);margin-top:0;margin-bottom:20px;padding-bottom:10px}.info-row{border-bottom:1px solid var(--border-light);justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;display:flex}.lbl{color:var(--text-muted);text-transform:uppercase;font-size:11px;font-weight:700}.val{color:var(--text-main);margin-top:2px;font-size:14px}.edit-link{color:var(--info);cursor:pointer;font-size:12px;font-weight:600;text-decoration:underline;white-space:nowrap;margin-left:10px}.link-text,.btn-delete-open{cursor:pointer;font-size:14px;font-weight:600;text-align:center}.link-text{color:var(--info);margin:0}.input-field{box-sizing:border-box;border:1px solid var(--border);border-radius:4px;width:100%;margin:8px 0;padding:10px}.btn,.btn-logout{cursor:pointer;border:none;border-radius:4px;width:100%;font-weight:600}.btn{margin-top:5px;padding:10px}.btn-update{background:var(--info);color:#fff}.btn-cancel{color:#fff;background:var(--text-muted)}.btn-logout,.btn-delete-confirm{background:var(--danger);color:#fff}.btn-logout{box-sizing:border-box;margin:0;padding:8px 10px}.btn-delete-open{color:var(--danger);background:0 0;border:none;padding:0;width:100%;box-sizing:border-box}.delete-section,.pass-section,.field-edit-section{border-top:1px solid var(--border-light);margin-top:15px;padding-top:15px;display:none}.delete-warning{color:var(--danger);text-align:center;margin-bottom:8px;font-size:13px;font-weight:600}#textFieldsBox .field-edit-section{border-top:0;margin:-8px 0 15px;padding-top:0}.field-edit-label{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px}</style><div class="profile-box" id="profileBox" style="visibility:hidden"><h3 class="profile-title">Profile</h3><div id="textFieldsBox"></div><div class="info-row" style="display:block"><div class="lbl">Upload Document</div><input class="input-field" id="docFileInput" type="file"><button class="btn btn-update" id="docUploadBtn">Upload</button><div class="val" id="docUploadStatus" style="display:none"></div></div><div class="rc-row-3" style="align-items:center;margin-top:20px"><span class="link-text" id="changePassLink">Change Password</span><button class="btn-logout" id="logoutBtn">Logout</button><button class="btn-delete-open" id="deleteOpenBtn">Delete Account</button></div><div class="field-edit-section" id="field-edit-section"><div class="field-edit-label" id="fieldEditLabel">Field</div><input class="input-field" id="fieldEditInput" type="text"><div class="rc-dd" id="mgmtEditDD" style="display:none;margin:8px 0"><div class="rc-dd-btn selected" id="mgmtEditBtn" onclick='openDD("mgmtEditMenu")'><span id="mgmtEditVal">Patient Management</span></div><div class="rc-dd-menu" id="mgmtEditMenu"><span data-val="patient" onclick='pickChip("Patient Management","patient")'>Patient Management</span><span data-val="worker" onclick='pickChip("Worker Management","worker")'>Worker Management</span><span data-val="student" onclick='pickChip("Student Management","student")'>Student Management</span><span data-val="client" onclick='pickChip("Client Management","client")'>Client Management</span><span data-val="staff" onclick='pickChip("Staff Management","staff")'>Staff Management</span></div></div><button class="btn btn-update" id="fieldEditSaveBtn">Save</button><button class="btn btn-cancel">Cancel</button></div><div class="field-edit-section" id="email-edit-section"><div class="field-edit-label">New Email</div><input class="input-field" id="emailEditInput" type="email"><div class="field-edit-label">Current Password</div><input class="input-field" id="emailEditPass" type="password"><button class="btn btn-update" id="emailEditSaveBtn">Save</button><button class="btn btn-cancel">Cancel</button></div><div class="pass-section" id="pass-section"><input class="input-field" id="curPass" type="password"><input class="input-field" id="newPass" type="password"><button class="btn btn-update" id="confirmPassBtn">Confirm Change</button><button class="btn btn-cancel">Cancel</button></div><div class="delete-section" id="delete-section"><div class="delete-warning">Warning: Deleting your account will permanently erase all data!</div><input class="input-field" id="delPass" type="password"><button class="btn btn-delete-confirm" id="deleteConfirmBtn">Yes, Delete</button><button class="btn btn-cancel">Cancel</button></div></div><script type="module">
import{db,auth,requireAuth,initDropdowns,toggleDropdown}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js";
import{collection as C,getDocs as GD,query as Q,where as W,deleteDoc as DD,doc as D,updateDoc as UD}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import{uploadPrivateDocument}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/supabase-storage.js";
import{signOut,EmailAuthProvider as EP,reauthenticateWithCredential as RA,updatePassword,updateEmail,deleteUser}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
const m=i=>document.getElementById(i),
REDIRECT_URL="https://rahcare.blogspot.com/p/login.html",
SECS=["field-edit-section","email-edit-section","pass-section","delete-section"],
FIELDS=[["centreName","Centre Name"],["centreType","Centre Type"],["managementType","Management Type"],["branchName","Branch Name"],["branchNumber","Branch Phone"],["branchAddress","Branch Address"],["siteHeading","Header Title"]],
MG={patient:"Patient Management",worker:"Worker Management",student:"Student Management",client:"Client Management",staff:"Staff Management"},
NAV={patient:"Add Patient",worker:"Add Worker",student:"Add Student",client:"Add Client",staff:"Add Staff"},
applyNav=x=>{const t=NAV[x];if(!t)return;try{localStorage.setItem("mgmtType",x)}catch(e){}document.querySelectorAll('a[href*="/p/appointment.html"],option[value*="/p/appointment.html"]').forEach(n=>n.textContent=t)},
hide=()=>SECS.forEach(i=>m(i).style.display="none"),
show=(i,a)=>{hide();const s=m(i),r=a&&a.closest(".info-row");if(r)r.after(s);s.style.display="block";s.scrollIntoView({block:"nearest",behavior:"smooth"})},
reauth=p=>RA(auth.currentUser,EP.credential(auth.currentUser.email,p)),
ERR=(e,t)=>alert(["auth/wrong-password","auth/invalid-credential"].includes(e.code)?t:e.message),
updUser=p=>UD(D(db,"users",docId),p),
bye=()=>{localStorage.clear();location.replace(REDIRECT_URL)},
val=i=>m(i).innerText==="N/A"?"":m(i).innerText;
let docId=null,mgmtChip={label:"Patient Management",val:"patient"};
initDropdowns(".rc-dd",".rc-dd-menu");
window.openDD=e=>toggleDropdown(m(e));
window.pickChip=(t,n)=>{mgmtChip={label:t,val:n};m("mgmtEditVal").textContent=t;m("mgmtEditBtn").classList.add("selected");document.querySelectorAll("#mgmtEditMenu span").forEach(e=>e.classList.toggle("checked",e.dataset.val===n));window.openDD("mgmtEditMenu")};
m("textFieldsBox").innerHTML=FIELDS.map(([f,l])=>`<div class="info-row"><div><div class="lbl">${l}</div><div class="val" id="view-${f}">Loading...</div></div><span class="edit-link" data-field="${f}" data-label="${l}" data-view="view-${f}">Edit</span></div>`).join("")+'<div class="info-row"><div><div class="lbl">Email</div><div class="val" id="view-email">Loading...</div></div><span class="edit-link" id="editEmailBtn">Edit</span></div>';
requireAuth(async u=>{const s=await GD(Q(C(db,"users"),W("uid","==",u.uid)));if(!s.empty){docId=s.docs[0].id;const d=s.docs[0].data();FIELDS.forEach(([f])=>{const v=m("view-"+f);if(f==="managementType"){v.dataset.raw=d[f]||"";v.innerText=MG[d[f]]||"N/A"}else v.innerText=d[f]||"N/A"});m("view-email").innerText=d.email||"N/A"}m("profileBox").style.visibility="visible"});
document.addEventListener("click",e=>{
if(e.target.closest(".btn-cancel")){hide();m("delPass").value="";return}
const t=e.target.closest(".edit-link[data-field]");
if(t){const{field,label,view}=t.dataset,isM=field==="managementType";show("field-edit-section",t);m("fieldEditLabel").innerText=label;m("fieldEditInput").style.display=isM?"none":"block";m("mgmtEditDD").style.display=isM?"block":"none";if(isM){const r=m(view).dataset.raw||"patient";mgmtChip={label:MG[r]||MG.patient,val:MG[r]?r:"patient"};m("mgmtEditVal").textContent=mgmtChip.label;document.querySelectorAll("#mgmtEditMenu span").forEach(e=>e.classList.toggle("checked",e.dataset.val===mgmtChip.val))}else{m("fieldEditInput").value=val(view);m("fieldEditInput").focus()}Object.assign(m("field-edit-section").dataset,{field,view});return}
if(e.target.id==="editEmailBtn"){show("email-edit-section",e.target);m("emailEditInput").value=val("view-email");m("emailEditPass").value=""}});
m("fieldEditSaveBtn").onclick=async()=>{const{field,view}=m("field-edit-section").dataset,isM=field==="managementType",x=isM?mgmtChip.val:m("fieldEditInput").value.trim();if(!x)return alert("This field cannot be empty!");if(!docId)return alert("User record not found.");try{await updUser({[field]:x});if(isM){m(view).dataset.raw=x;m(view).innerText=MG[x]||x;applyNav(x)}else m(view).innerText=x;hide();alert("Updated successfully!")}catch(e){alert("Error: "+e.message)}};
m("emailEditSaveBtn").onclick=async()=>{const em=m("emailEditInput").value.trim(),p=m("emailEditPass").value;if(!em||!p)return alert("Please enter both new email and current password.");try{await reauth(p);await updateEmail(auth.currentUser,em);if(docId)await updUser({email:em});m("view-email").innerText=em;hide();alert("Email changed successfully!")}catch(e){e.code==="auth/email-already-in-use"?alert("This email is already in use."):e.code==="auth/requires-recent-login"?alert("For security, please log in again and try."):ERR(e,"Incorrect password!")}};
m("changePassLink").onclick=()=>show("pass-section");
m("confirmPassBtn").onclick=async()=>{const c=m("curPass").value,n=m("newPass").value;if(!c||!n)return alert("Please enter both passwords");try{await reauth(c);await updatePassword(auth.currentUser,n);alert("Password changed successfully!");hide();m("curPass").value=m("newPass").value=""}catch(e){ERR(e,"Current password incorrect!")}};
m("docUploadBtn").onclick=async()=>{const f=m("docFileInput").files[0],st=m("docUploadStatus"),b=m("docUploadBtn");if(!f)return alert("Please choose a file first.");if(!auth.currentUser)return alert("Please log in again.");b.disabled=true;b.innerText="Uploading...";st.style.display="block";st.innerText="";try{const path=await uploadPrivateDocument(f,auth.currentUser.uid);if(path){st.innerText="Uploaded: "+f.name;m("docFileInput").value=""}else st.innerText="Upload failed. Please try again."}catch(e){st.innerText="Upload failed: "+e.message}b.disabled=false;b.innerText="Upload"};
m("logoutBtn").onclick=()=>signOut(auth).then(bye);
m("deleteOpenBtn").onclick=()=>show("delete-section");
m("deleteConfirmBtn").onclick=async()=>{const p=m("delPass").value;if(!p)return alert("Please enter password!");try{await reauth(p);if(docId)await DD(D(db,"users",docId));await deleteUser(auth.currentUser);localStorage.clear();alert("Your account has been deleted successfully.");bye()}catch(e){ERR(e,"Incorrect password!")}};
</script>
