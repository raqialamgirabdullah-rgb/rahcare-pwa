<i data-rc-hide-chrome="2" hidden></i><link rel="stylesheet" href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css?v=23"><style>.avatar-container{display:flex;justify-content:center;margin-bottom:15px}.avatar-icon{width:90px;height:90px;border-radius:50%;background:var(--primary-light);border:1px solid var(--border);position:relative;overflow:hidden}.avatar-icon:before{content:"";position:absolute;top:18px;left:27px;width:36px;height:36px;border-radius:50%;background:#cbd5e1}.avatar-icon:after{content:"";position:absolute;bottom:-4px;left:13px;width:64px;height:36px;border-radius:30px 30px 0 0;background:#cbd5e1}.auth-title{text-align:center;color:var(--text-sub);margin:0 0 25px;font-size:18px;font-weight:500}.eye-icon{position:absolute;top:50%;right:12px;transform:translateY(-50%);cursor:pointer;color:var(--text-muted)}.reset-link{display:block;text-align:right;color:var(--primary);margin-top:5px;font-size:13px;font-weight:600;text-decoration:none}.login-submit-btn{display:block;width:auto;min-width:120px;margin:20px auto 0;border-radius:20px;padding:10px 25px}.footer-text{text-align:center;color:var(--text-sub);margin-top:25px;font-size:14px}.footer-text a{color:var(--primary);font-weight:600;text-decoration:none}</style><div class="rc-card" style="max-width:340px"><div class="avatar-container"><div class="avatar-icon"></div></div><h2 class="auth-title">Sign In</h2><form autocomplete="off" onsubmit="handleLogin(event)"><div class="form-group" style="margin-bottom:15px"><input placeholder="Phone / Email" autocomplete="off" class="rc-input" id="login-user" required></div><div class="form-group" style="margin-bottom:15px;position:relative"><input autocomplete="off" class="rc-input" id="login-pass" placeholder="Password" required type="password" style="padding-right:35px"> <span onclick='togglePass("login-pass",this)' class="eye-icon">👁</span></div><a class="reset-link" href="#">Reset Password</a> <button class="rc-btn rc-btn-primary login-submit-btn">Sign in</button></form><div class="footer-text">New here? <a href="https://rahcare.blogspot.com/p/sign-up.html">Sign up</a></div></div><script type="module">import{db,auth,togglePasswordVisibility,autoClearAuthForm}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=17";import{collection,query,where,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";import{signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";autoClearAuthForm(),window.togglePass=(t,e)=>togglePasswordVisibility(t,e);const DASHBOARD_URL="https://rahcare.blogspot.com/p/dashboard.html",WORKER_PORTAL_URL="https://rahcare.blogspot.com/p/worker-portal.html",redirectTo=dest=>cred=>{let e=cred.user.uid;localStorage.setItem("uid",e),localStorage.setItem("userId",e),localStorage.setItem("user_id",e),window.location.replace(dest)};window.handleLogin=t=>{t.preventDefault();let e=document.getElementById("login-user").value.trim(),s=document.getElementById("login-pass").value;if(e.includes("@"))signInWithEmailAndPassword(auth,e,s).then(redirectTo(DASHBOARD_URL)).catch(t=>alert("Error: "+t.message));else{let phone=e.startsWith("+880")?e:e.startsWith("0")?"+880"+e.substring(1):"+880"+e;const tryWorkerLogin=()=>{getDoc(doc(db,"workerLogins",phone)).then(w=>{if(!w.exists()||w.data().active===false)return void alert("No account found with this number.");let e=w.data().loginEmail;signInWithEmailAndPassword(auth,e,s).then(redirectTo(WORKER_PORTAL_URL)).catch(t=>alert("Error: "+t.message))}).catch(t=>alert("Error: "+t.message))};getDocs(query(collection(db,"users"),where("phone","==",phone))).then(u=>{if(!u.empty){let e=u.docs[0].data().email;return void signInWithEmailAndPassword(auth,e,s).then(redirectTo(DASHBOARD_URL)).catch(t=>alert("Error: "+t.message))}tryWorkerLogin()}).catch(err=>{"permission-denied"===err.code?tryWorkerLogin():alert("Error: "+err.message)})}}</script>
