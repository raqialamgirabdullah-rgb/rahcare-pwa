,reject)=>{if(!navigator.geolocation)return reject(new Error("Geolocation not supported on this device."));navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),()=>reject(new Error("Could not get your location. Please turn on GPS and try again.")),{enableHighAccuracy:!0,timeout:1e4})})}const bnDigits=["\u09e6","\u09e7","\u09e8","\u09e9","\u09ea","\u09eb","\u09ec","\u09ed","\u09ee","\u09ef"];function toBnNum(n){return String(n).split("").map(c=>/[0-9]/.test(c)?bnDigits[+c]:c).join("")}function formatHM(totalHours){const h=Math.floor(totalHours||0),m=Math.round(((totalHours||0)-h)*60);return`${toBnNum(h)}\u0998\u09a8\u09cd\u099f\u09be ${toBnNum(m)}\u09ae\u09bf\u09a8\u09bf\u099f`}async function getTodayAttendance(){const today=toISODate(new Date()),snap=await getDocs(query(collection(db,"attendance"),where("workerAuthUid","==",uid),where("date","==",today)));return snap.empty?null:{id:snap.docs[0].id,...snap.docs[0].data()}}async function loadTodayStatus(){const today=toISODate(new Date());todayDocId=`${phoneKey}_${today}`;const rec=await getTodayAttendance(),badge=$("wpPortalStatusBadge"),btn=$("wpCheckBtn");if(rec&&rec.checkInAt){$("wpPortalInTime").textContent=formatTime12(new Date(rec.checkInAt).toTimeString().slice(0,5));if(rec.checkOutAt){$("wpPortalOutTime").textContent=formatTime12(new Date(rec.checkOutAt).toTimeString().slice(0,5)),badge.textContent="Checked Out",badge.className="rc-badge rc-badge-ok",btn.disabled=!0,btn.textContent="Done for Today"}else{badge.textContent="Checked In",badge.className="rc-badge rc-badge-pending",btn.disabled=!1,btn.textContent="Check Out"}}else{$("wpPortalInTime").textContent="--:--",$("wpPortalOutTime").textContent="--:--",badge.textContent="Not Checked In",badge.className="rc-badge rc-badge-danger",btn.disabled=!1,btn.textContent="Check In"}}window.wpDoCheck=async()=>{const btn=$("wpCheckBtn"),origText=btn.textContent;btn.disabled=!0,btn.textContent="Please wait...";try{let loc=null;try{const orgSnap=await getDoc(doc(db,"organizations",worker.orgUid));if(orgSnap.exists()&&null!=orgSnap.data().officeLat){const org=orgSnap.data(),pos=await getCurrentPosition(),d=distMeters(pos.lat,pos.lng,org.officeLat,org.officeLng);if(d>(org.allowedRadius||150)){alert(`You are too far from the office (${Math.round(d)}m away). Please check in from the office location.`),btn.disabled=!1,btn.textContent=origText;return}loc=pos}}catch(locErr){alert(locErr.message||"Could not verify your location."),btn.disabled=!1,btn.textContent=origText;return}const rec=await getTodayAttendance(),now=(new Date).toISOString();if(rec&&rec.checkInAt)await updateDoc(doc(db,"attendance",rec.id),{checkOutAt:now,...loc?{checkOutLat:loc.lat,checkOutLng:loc.lng}:{}});else await setDoc(doc(db,"attendance",todayDocId),{orgUid:worker.orgUid,workerAuthUid:uid,phoneKey,date:toISODate(new Date()),checkInAt:now,...loc?{checkInLat:loc.lat,checkInLng:loc.lng}:{}},{merge:!0});await loadTodayStatus(),await loadMonthlyReport()}catch(err){console.error(err),alert("Something went wrong. Please try again."),btn.disabled=!1,btn.textContent=origText}};async function loadMonthlyReport(){$("wpPortalMonthLabel").textContent=monthLabel(curMonth);const[y,m]=curMonth.split("-").map(Number),daysInMonth=new Date(y,m,0).getDate(),todayISO=toISODate(new Date()),snap=await getDocs(query(collection(db,"attendance"),where("workerAuthUid","==",uid))),records={};snap.forEach(d=>{const r=d.data();r.date&&r.date.startsWith(curMonth)&&(records[r.date]=r)});let present=0,absent=0,otHours=0,total=0;const dailyRate="daily"===worker.salaryType?parseFloat(worker.salaryAmount)||0:(parseFloat(worker.salaryAmount)||0)/daysInMonth,otRate="fixed"===worker.overtimeRateType?parseFloat(worker.overtimeRate)||0:dailyRate/(parseFloat(worker.workHours)||8),rows=[];for(let day=1;day<=daysInMonth;day++){const dateStr=ymd(y,m,day);if(worker.joinDate&&dateStr<worker.joinDate)continue;if(dateStr>todayISO)continue;const rec=records[dateStr],
