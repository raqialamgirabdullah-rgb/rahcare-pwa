<script type="module">
import{collection,doc,setDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const $=e=>document.getElementById(e);

const L={ruqyah:"রুকইয়াহ",hijama:"হিজামা",totalIncome:"মোট আয়",totalExpense:"মোট ব্যয়",remaining:"অবশিষ্ট",cash:"ক্যাশ",prevCash:"পূর্বের ক্যাশ",monthlyIncome:"মাসিক আয়",monthlyExpense:"মাসিক ব্যয়",month:"মাস",noDataMonth:"এই মাসে কোনো তথ্য নেই",noData:"কোনো তথ্য নেই"};

const EXPENSE_FIELDS=[["expCommission","commission","কমিশন"],["expSalary","salary","বেতন"],["expFood","food","খাবার বিল"],["expOffice","office","অফিস খরচ"],["expRent","rent","বাসা ভাড়া"],["expBoosting","boosting","বুস্টিং"]];
let uid=null,currentDate="",appointmentsUnsub=null,expenseUnsub=null,allExpensesUnsub=null,globalAppointments=[],expenseValues={},allExpensesMap={},allCashMap={},saveTagTimer=null,revealed=!1,monthViewYear=0,monthViewMonth=0,expenseRawText={},viewAll=!1,yesterdayCashValue=0;
function computeSum(e){return String(e).split("+").reduce((e,t)=>e+(parseFloat(t.trim())||0),0)}
function inputField([id,,label]){return `<div class="exp-field"><label class="exp-label" for="${id}">${label}</label><input type="text" inputmode="tel" class="rc-input" id="${id}" placeholder="0"></div>`}
function fieldBordered(label,id,eqPrefix){return `<div class="exp-field"><label class="exp-label" for="${id}">${eqPrefix?'<span class="eq-mini">=</span>':''}${label}</label><input type="text" class="rc-input" id="${id}" value="0" readonly></div>`}
function buildExpenseGrid(){$("expenseGrid").innerHTML=EXPENSE_FIELDS.map(inputField).join("")+fieldBordered(L.totalExpense,"expenseTotal",!0)+fieldBordered(L.remaining,"remainingTotal")}
function buildIncomeGrid(){$("incomeGrid").innerHTML=fieldBordered(L.ruqyah,"incomeRuqyah")+fieldBordered(L.hijama,"incomeHijama")+fieldBordered(L.totalIncome,"incomeTotal",!0)}
function buildCashGrid(){$("cashGrid").innerHTML=fieldBordered(L.prevCash,"yesterdayCash")+fieldBordered(L.remaining,"remainingMirror")+fieldBordered(L.cash,"cashTotal",!0)}
function getLastKnownCash(beforeDate){let best=null;Object.keys(allCashMap).forEach(d=>{d<beforeDate&&(best===null||d>best)&&(best=d)});return best===null?0:allCashMap[best]}
function reveal(){revealed||(revealed=!0,$("authOverlay").style.display="none",$("dashWrap").style.display="block",document.documentElement.style.visibility="visible")}
function updateDateHeader(){const e=currentDate.split("-");$("monthText").textContent=MONTH_SHORT[parseInt(e[1])-1]||L.month,$("dateFilterText").textContent=formatDateDMY(currentDate);const t=$("mainDateFilter");t&&(t.value=currentDate)}
function dayIncome(e){const t=globalAppointments.filter(t=>(t.date+"").trim()===e&&"cancelled"!==(t.status+"").trim().toLowerCase()&&isPaid(t));let n=0,a=0;return t.forEach(e=>{const t=parseFloat(e.paid||e.bill)||0;isHijama(e)?a+=t:n+=t}),{ruqyah:n,hijama:a,total:n+a}}
function dayExpense(e){const t=allExpensesMap[e]||{};let n=0;return EXPENSE_FIELDS.forEach(([,e])=>{n+=parseFloat(t[e])||0}),n}
function recalcIncome(){const e=dayIncome(currentDate);$("incomeRuqyah").value=e.ruqyah,$("incomeHijama").value=e.hijama,$("incomeTotal").value=e.total,recalcRemaining(e.total)}
function recalcExpense(){let e=0;EXPENSE_FIELDS.forEach(([,t])=>{e+=parseFloat(expenseValues[t])||0}),$("expenseTotal").value=e;recalcRemaining(parseFloat($("incomeTotal").value)||0,e)}
function recalcRemaining(e,t){const n=void 0!==e?e:parseFloat($("incomeTotal").value)||0;let a=t;void 0===a&&(a=0,EXPENSE_FIELDS.forEach(([,e])=>{a+=parseFloat(expenseValues[e])||0}));const o=n-a,s=$("remainingTotal");s.value=o,s.classList.remove("positive","negative"),s.classList.add(o<0?"negative":"positive"),recalcCash()}
function recalcCash(){const rem=parseFloat($("remainingTotal").value)||0,cash=yesterdayCashValue+rem;$("yesterdayCash").value=yesterdayCashValue,$("remainingMirror").value=rem,$("cashTotal").value=cash}
function updateYesterdayCash(){yesterdayCashValue=getLastKnownCash(currentDate),recalcCash()}
function fillExpenseInputs(){EXPENSE_FIELDS.forEach(([e,t])=>{const n=$(e);document.activeElement!==n&&(n.value=expenseValues[t]||"",expenseRawText[e]=expenseValues[t]||"")})}
function attachExpenseListener(){expenseUnsub&&(expenseUnsub(),expenseUnsub=null);expenseUnsub=onSnapshot(doc(db,"dailyAccounts",uid+"_"+currentDate),e=>{expenseValues=e.exists()&&e.data().expenses||{},fillExpenseInputs(),recalcExpense()},e=>{console.error("expense listen error:",e)})}
async function persistExpenses(){const e=uid+"_"+currentDate,cashVal=yesterdayCashValue+(parseFloat($("remainingTotal").value)||0);await setDoc(doc(db,"dailyAccounts",e),{uid:uid,date:currentDate,expenses:expenseValues,cash:cashVal,updatedAt:(new Date).toISOString()},{merge:!0})}

async function saveExpenseField(e,t){expenseValues[e]=t,recalcExpense();try{await persistExpenses(),flashSaveTag(MSG.saved)}catch(e){console.error("Firestore save failed:",e),flashSaveTag(MSG.failed)}}
async function saveAllExpenses(){const e=$("saveAllBtn");EXPENSE_FIELDS.forEach(([e,t])=>{const n=$(e),a=n.value;expenseRawText[e]=a;const o=""===a.trim()?"":computeSum(a);n.value=o,expenseValues[t]=o}),recalcExpense(),e.disabled=!0,e.textContent=MSG.saving;try{await persistExpenses(),e.textContent=MSG.saved,flashSaveTag(MSG.saved,!0),saveTagTimer=setTimeout(()=>{$("saveTag").textContent="",e.textContent=MSG.saveBtn,e.disabled=!1},1500)}catch(t){console.error("Firestore save failed:",t),e.textContent=MSG.retry,flashSaveTag(MSG.failed,!0),e.disabled=!1}}
function bindExpenseInputs(){EXPENSE_FIELDS.forEach(([e,t])=>{const n=$(e);n.addEventListener("focus",()=>{void 0!==expenseRawText[e]&&(n.value=expenseRawText[e])}),n.addEventListener("blur",()=>{const a=n.value;if(expenseRawText[e]=a,""===a.trim())return void saveExpenseField(t,"");const o=computeSum(a);n.value=o,saveExpenseField(t,o)})})}
function loadForDate(){updateDateHeader(),recalcIncome(),attachExpenseListener(),updateYesterdayCash()}
function initDateInputListener(){const e=$("mainDateFilter");e&&e.addEventListener("change",e=>{e.target.value&&(currentDate=e.target.value,loadForDate())})}
function attachAllExpensesListener(){if(allExpensesUnsub)return;const e=query(collection(db,"dailyAccounts"),where("uid","==",uid));allExpensesUnsub=onSnapshot(e,e=>{const t={},c={};e.docs.forEach(e=>{const n=e.data();n.date&&(t[n.date]=n.expenses||{},void 0!==n.cash&&(c[n.date]=parseFloat(n.cash)||0))});allExpensesMap=t;allCashMap=c;updateYesterdayCash();"none"!==$("monthModal").style.display&&renderMonthView();viewAll&&renderAllMonths()},e=>{console.error("all expenses listen error:",e)})}
function renderMonthView(){$("monthModalTitle").textContent=`${MONTH_NAMES[monthViewMonth]} ${monthViewYear}`;const daysInMonth=new Date(monthViewYear,monthViewMonth+1,0).getDate();const body=$("monthModalBody");let rows="",totalIncome=0,totalExpense=0;for(let d=1;d<=daysInMonth;d++){const dateStr=ymd(monthViewYear,monthViewMonth+1,d);const inc=dayIncome(dateStr).total,exp=dayExpense(dateStr),rem=inc-exp;totalIncome+=inc,totalExpense+=exp;if(!inc&&!exp)continue;rows+=`<div class="month-day-row" data-date="${dateStr}"><span class="month-day-date">${formatDateDMY(dateStr)}</span><span class="month-day-nums"><span class="inc">${inc}</span><span class="exp">${exp}</span><span class="rem">${rem}</span></span></div>`}body.innerHTML=rows||`<div class="rc-empty">${L.noDataMonth}</div>`;body.querySelectorAll(".month-day-row").forEach(e=>{e.addEventListener("click",()=>{currentDate=e.dataset.date,loadForDate(),window.closeMonthView()})});const remaining=totalIncome-totalExpense;$("monthModalFooter").innerHTML=`<span>${L.monthlyIncome}: ${totalIncome}</span><span>${L.monthlyExpense}: ${totalExpense}</span><span>${L.remaining}: ${remaining}</span>`}
function computeMonthTotals(monthKey){const inc=globalAppointments.filter(a=>{const d=(a.date+"").trim();return d.slice(0,7)===monthKey&&"cancelled"!==((a.status||"")+"").trim().toLowerCase()&&isPaid(a)});let rq=0,hj=0;inc.forEach(a=>{const amt=parseFloat(a.paid||a.bill)||0;isHijama(a)?hj+=amt:rq+=amt});let exp=0;Object.keys(allExpensesMap).forEach(dateKey=>{if(dateKey.slice(0,7)===monthKey)exp+=dayExpense(dateKey)});return{rq,hj,income:rq+hj,exp,remaining:rq+hj-exp}}
function accRow(label,value,cls){return `<div class="acc-row acc-total${cls?" "+cls:""}"><span class="acc-label">${label}</span><span class="acc-value${cls?" "+(value<0?"negative":"positive"):""}">${value}</span></div>`}
function renderAllMonths(){const monthsSet=new Set();globalAppointments.forEach(a=>{const d=(a.date+"").trim();if(d)monthsSet.add(d.slice(0,7))});Object.keys(allExpensesMap).forEach(d=>{if(d)monthsSet.add(d.slice(0,7))});const months=Array.from(monthsSet).sort((a,b)=>b.localeCompare(a));const wrap=$("allMonthsWrap");if(!months.length){wrap.innerHTML=`<div class="rc-empty">${L.noData}</div>`;return}wrap.innerHTML=months.map(mk=>{const t=computeMonthTotals(mk);return `<div class="category-section"><div class="category-heading">📅 ${monthLabel(mk)}</div><div class="income-split"><div class="income-item"><span class="acc-label">${L.ruqyah}</span><span class="acc-value">${t.rq}</span></div><div class="income-item"><span class="acc-label">${L.hijama}</span><span class="acc-value">${t.hj}</span></div></div>${accRow(L.totalIncome,t.income)}${accRow(L.totalExpense,t.exp)}${accRow(L.remaining,t.remaining,"acc-remaining")}</div>`}).join("")}
function buildMonthPickerMenu(){const menu=$("monthPickerMenu");menu.innerHTML=MONTH_NAMES.map((name,idx)=>`<span data-m="${idx}">${name}</span>`).join("");menu.querySelectorAll("span").forEach(sp=>{sp.onclick=()=>{const idx=parseInt(sp.dataset.m,10);const yr=parseInt((currentDate||toISODate(new Date())).split("-")[0],10)||new Date().getFullYear();monthViewYear=yr,monthViewMonth=idx;menu.classList.remove("open");attachAllExpensesListener();renderMonthView();$("monthModal").style.display="flex"}})}
function start(){blockCacheAndBack();buildExpenseGrid();buildIncomeGrid();buildCashGrid();buildMonthPickerMenu();$("saveAllBtn").textContent=MSG.saveBtn;initDropdowns(".rc-dd");requireAuth(e=>{uid=e.uid;currentDate=toISODate(new Date());initDateInputListener();bindExpenseInputs();$("saveAllBtn").addEventListener("click",saveAllExpenses);attachAllExpensesListener();appointmentsUnsub&&(appointmentsUnsub(),appointmentsUnsub=null);const t=query(collection(db,"appointments"),where("uid","==",uid));appointmentsUnsub=onSnapshot(t,e=>{globalAppointments=docsOf(e,"docId");loadForDate();viewAll&&renderAllMonths();reveal()},e=>{console.error(e),reveal()})})}
function positionMonthMenu(){const anchor=$("monthPickerDd"),menu=$("monthPickerMenu");if(!anchor||!menu)return;const rect=anchor.getBoundingClientRect(),margin=8,menuW=Math.min(230,window.innerWidth-margin*2);let left=rect.right-menuW;left=Math.max(margin,Math.min(left,window.innerWidth-menuW-margin));let top=rect.bottom+6;top=Math.min(top,window.innerHeight-margin);menu.style.left=left+"px",menu.style.top=top+"px"}
