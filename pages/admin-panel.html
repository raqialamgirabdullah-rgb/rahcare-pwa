<link rel="stylesheet" href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css?v=40" /><style>
  :root {
    --card-bg: #fff;
  }
  body {
    font-family: var(--font-main);
    background: var(--bg-color);
    margin: 0;
    padding: 5px;
    color: var(--text-color);
  }
  .sec {
    margin-bottom: 22px;
  }
  #myReportWrap > .wrap {
    background: transparent;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
  }
  #myReportWrap .img-row {
    background: var(--card-bg, #fff);
    box-shadow: var(--shadow-card);
  }
  #myReportWrap .sec:has(.opt-row) {
    background: var(--card-bg, #fff);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 10px;
    box-shadow: var(--shadow-card);
  }
</style>
<div id="authOverlay" class="rc-auth-overlay">⏳ যাচাই করা হচ্ছে...</div>
<div id="myReportWrap" style="display: none">
  <div class="wrap">
    <div class="sec">
      <div class="sec-title" style="display: flex; justify-content: space-between; align-items: center">
        <span>🖼️ Branding</span>
      </div>
      <div id="imgBox"></div>
      <div class="img-row hd-row" id="hdRow">
        <div class="hd-in">
          <div class="lbl-row"><div class="lbl">Header Title</div></div>
          <input
            id="hdTitle"
            type="text"
            class="rc-input"
            placeholder="Header Title"
            maxlength="80"
            style="width: 100%; box-sizing: border-box; margin: 6px 0 8px"
          /><button class="opt-btn" id="hdSave" style="width: 100%; padding: 10px">Save</button>
          <div id="hdMsg" class="val" style="font-size: 12px; text-align: center; margin-top: 6px"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    __bip = e;
    dispatchEvent(new Event("bip"));
  });
  var __bip;
</script>
<script type="module">
  import { getAuth } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { openTemplateEditor } from "https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/template-editor.js?v=8";
  import {
    requireAuth,
    blockCacheAndBack,
    mountAdminTools,
  } from "https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=31";
  blockCacheAndBack();
  const v = (i) => document.getElementById(i);
  const T = mountAdminTools(),
    { initImg, updU, UNF } = T;

  {
    const ra = v("row-appointment"),
      h = v("hdRow");
    ra && h && ra.after(h);
  }
  v("hdSave").onclick = async () => {
    const t = v("hdTitle").value.trim(),
      b = v("hdSave"),
      m = v("hdMsg");
    if (!T.uDoc) return alert(UNF);
    b.disabled = !0;
    m.textContent = "";
    try {
      await updU({ siteHeading: t });
      try {
        localStorage.setItem("rcSH", t);
      } catch (e) {}
      if (t) {
        const h = document.getElementById("site-heading-h1");
        if (h) {
          const l = h.querySelector("a");
          l ? (l.textContent = t) : (h.textContent = t);
        }
        m.textContent = "✔ Saved";
      } else m.textContent = "✔ Saved (default heading will show after refresh)";
    } catch (e) {
      alert("Error: " + e.message);
    }
    b.disabled = !1;
  };
  requireAuth(async (u) => {
    v("authOverlay").style.display = "none";
    v("myReportWrap").style.display = "block";
    initImg(u.uid).then(() => {
      v("hdTitle").value = T.uData?.siteHeading || "";
      const bx = v("imgBox"),
        hr = v("hdRow"),
        last = hr && hr.parentNode === bx ? hr : v("row-appointment");
      if (!last || v("edRow")) return;
      const w = document.createElement("div");
      w.id = "edRow";
      w.className = "ed-row";
      [
        ["invoice", "Invoice Edit"],
        ["slip", "Appointment Slip Edit"],
      ].forEach(([k, t]) => {
        const x = document.createElement("button");
        x.id = "ed-" + k;
        x.className = "opt-btn";
        x.textContent = "✏️ " + t;
        x.onclick = () => {
          if (!T.uDoc) return alert(UNF);
          openTemplateEditor(k, { data: T.uData || {}, save: T.updU });
        };
        w.appendChild(x);
      });
      last.after(w);
    });
  });
</script>
