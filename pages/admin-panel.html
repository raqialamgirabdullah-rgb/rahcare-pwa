<link rel="stylesheet" href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css?v=13"><style>:root{--card-bg:#fff}body{font-family:'Segoe UI',Roboto,sans-serif;background:var(--bg-color);margin:0;padding:5px;color:var(--text-color)}.sec{margin-bottom:22px}</style>
<div id="authOverlay" class="rc-auth-overlay">⏳ যাচাই করা হচ্ছে...</div>
<div id="pwGate"><div class="box"><h3>🔒 Admin Panel</h3><input type="password" id="pwInput" placeholder="Password" autocomplete="current-password"><button id="pwBtn">Enter</button><div id="pwErr"></div></div></div>
<div id="myReportWrap" style="display:none"><div class="wrap"><div class="sec"><div class="sec-title">🖼️ Branding</div><div id="imgBox"></div></div><div class="sec"><div class="sec-title">🏷️ Site Heading</div><div class="lbl">Header Title</div><input id="hdTitle" type="text" class="rc-input" placeholder="Header Title" maxlength="80" style="width:100%;box-sizing:border-box;margin:6px 0 8px"><button class="opt-btn" id="hdSave" style="width:100%;padding:10px">Save</button><div id="hdMsg" class="val" style="font-size:12px;text-align:center;margin-top:6px"></div></div><div class="sec"><div class="opt-row"><div class="opt-grp"><span class="val">Default</span><button class="opt-btn" id="instDef">Install</button></div><div class="sec-title">📲 Install App</div><div class="opt-grp"><button class="opt-btn" id="instCus">Install</button><span class="val">Custom</span></div></div><div id="instMsg" class="val" style="font-size:12px;text-align:center"></div><div id="instCustom"><div class="lbl">App Name (Editable)</div><input id="instName" type="text"><button class="opt-btn" id="instGo">Install App</button><button class="opt-btn" id="instCancel">Cancel</button></div></div></div></div>
<script>addEventListener("beforeinstallprompt",e=>{e.preventDefault();__bip=e;dispatchEvent(new Event("bip"))});var __bip</script>
<script type="module">

import{getAuth}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import{openTemplateEditor}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/template-editor.js?v=2";
import{requireAuth,blockCacheAndBack,mountAdminTools}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=14";
blockCacheAndBack();
const v=i=>document.getElementById(i);
const T=mountAdminTools(),{ask,initImg,updU,UNF}=T;
const OKK="rcAdminOK",ACT="rcActive",LIM=9e5,
ls=(f,k,x)=>{try{return localStorage[f](k,x)}catch{}},
fresh=()=>Date.now()-(+ls("getItem",ACT)||0)<LIM;
let unl=!1,asking=!1,lt=0;
const unlock=()=>{unl=!0;asking=!1;ls("setItem",OKK,"1");ls("setItem",ACT,Date.now())},
relock=()=>{if(asking)return;unl=!1;asking=!0;ls("removeItem",OKK);ask(getAuth().currentUser).then(unlock)},
beat=()=>{const n=Date.now();if(!unl||n-lt<5e3)return;lt=n;ls("setItem",ACT,n)};
["pointerdown","keydown","touchstart","scroll"].forEach(e=>addEventListener(e,beat,{passive:!0,capture:!0}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&unl&&!fresh())relock()});
v("hdSave").onclick=async()=>{const t=v("hdTitle").value.trim(),b=v("hdSave"),m=v("hdMsg");if(!T.uDoc)return alert(UNF);b.disabled=!0;m.textContent="";try{await updU({siteHeading:t});if(t){const h=document.getElementById("site-heading-h1");if(h){const l=h.querySelector("a");l?l.textContent=t:h.textContent=t}m.textContent="✔ Saved"}else m.textContent="✔ Saved (default heading will show after refresh)"}catch(e){alert("Error: "+e.message)}b.disabled=!1};
setInterval(()=>{unl&&!fresh()&&relock()},3e4);
requireAuth(async u=>{v("authOverlay").style.display="none";
if(ls("getItem",OKK)==="1"&&fresh())unl=!0;else{asking=!0;await ask(u);unlock()}
v("myReportWrap").style.display="block";initImg(u.uid).then(()=>{v("hdTitle").value=T.uData?.siteHeading||"";
[["invoice","row-invoice","Invoice Edit"],["slip","row-appointment","Appointment Slip Edit"]].forEach(([k,r,t])=>{const row=v(r);if(!row||v("ed-"+k))return;const x=document.createElement("button");x.id="ed-"+k;x.className="opt-btn";x.style.cssText="width:100%;margin:6px 0 14px;padding:10px";x.textContent="✏️ "+t;x.onclick=()=>{if(!T.uDoc)return alert(UNF);openTemplateEditor(k,{data:T.uData||{},save:T.updU})};row.after(x)})})});
</script>
