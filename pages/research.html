<script type="module">
import{db,auth,requireAuth}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=30";
import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const BASE="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/",DV="2",$=i=>document.getElementById(i);
const SN="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const MARKS=/[\u0610-\u061A\u064B-\u065F\u06D6-\u06ED\u0640]/g;
const nz=(s,dag)=>String(s||"").replace(/\u0670/g,dag?"ا":"").replace(MARKS,"").replace(/[أإآٱ]/g,"ا").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A]/g,"");
const lk=s=>nz(s).replace(/[اويء]/g,"");
const lessAl=s=>s.length>3&&s.startsWith("ال")?s.slice(2):s;
let R=null,AY=null,ayP=null,BN=null,WB=null;
const el=(t,c,x)=>{const e=document.createElement(t);c&&(e.className=c);x!=null&&(e.textContent=x);return e};
const bn2=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
async function loadRoots(){if(R)return R;const j=await(await fetch(BASE+"quran-roots.json?v="+DV)).json();
R=j.roots.map(([r,fs])=>{const forms=fs.map(([t,l,refs,m])=>({t,l,m:m||"",refs:refs.split(","),k1:nz(t,1),k2:nz(t),k3:lk(t),kl:nz(l)}));return{r,rn:nz(r),r3:lk(r),forms,n:forms.reduce((a,f)=>a+f.refs.length,0)}});return R}
const jf=n=>fetch(BASE+n+"?v="+DV).then(r=>r.json());
const CH={a:{},b:{},w:{}};
const chunk=(k,s)=>CH[k][s]||(CH[k][s]=fetch(BASE+"quran-chunks/"+k+"/"+s+".json?v="+DV).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{delete CH[k][s];throw e}));
function search(q){const out=[];for(const r of R){let sc=0,mf=null;
 if(r.rn===q)sc=100;
 else{const ex=r.forms.filter(f=>f.k1===q||f.k2===q||lessAl(f.k1)===q||lessAl(f.k2)===q);
  if(ex.length){sc=80;mf=ex}
  else if(q.length>=2&&r.rn.includes(q))sc=60;
  else if(q.length>=2){const p=r.forms.filter(f=>f.k1.includes(q)||f.k2.includes(q));if(p.length){sc=40;mf=p}else{const l=r.forms.filter(f=>f.kl.includes(q));if(l.length){sc=30;mf=l}}}}
 if(sc)out.push({r,sc,mf})}
 if(!out.length){const q3=lk(q);if(q3.length>=2)for(const r of R){let sc=0,mf=null;
  if(r.r3===q3)sc=50;else{const p=r.forms.filter(f=>f.k3.includes(q3));if(p.length){sc=35;mf=p}}
  if(sc)out.push({r,sc,mf,loose:1})}}
 return out.sort((a,b)=>b.sc-a.sc||b.r.n-a.r.n)}
function searchBn(q){const out=[];for(const r of R){const ex=[],pt=[];for(const f of r.forms){if(!f.m)continue;if(f.m===q)ex.push(f);else if(f.m.includes(q))pt.push(f)}
 if(ex.length)out.push({r,sc:60,mf:ex,bn:1});else if(pt.length)out.push({r,sc:40,mf:pt,bn:1})}
 return out.sort((a,b)=>b.sc-a.sc||b.mf.length-a.mf.length||b.r.n-a.r.n)}
function verses(host,refs){let shown=0;const step=15;
 const more=el("button","rs-more","আয়াত লোড হচ্ছে…");more.type="button";
 const add=async()=>{more.disabled=true;more.style.display="";more.textContent="আয়াত লোড হচ্ছে…";
  const batch=refs.slice(shown,shown+step).map(r=>r.split(":").map(Number));
  try{await Promise.all([...new Set(batch.map(x=>x[0]))].map(s=>Promise.all([chunk("a",s),chunk("b",s)])))}
  catch(e){more.disabled=false;more.textContent="লোড করা যায়নি — আবার চেষ্টা করতে চাপুন";return}
  for(const [s,a,w] of batch){shown++;const t=((await chunk("a",s))||[])[a-1];if(t==null)continue;const bn=(await chunk("b",s))||[];
   const box=el("div","rs-vi"),rf=el("div","rs-vr");rf.append("সূরা ",el("span","rs-ar",SN[s-1])," — "+bn2(s)+":"+bn2(a));
   const tx=el("div","rs-vt rs-ar"),tb=el("div","rs-vb",bn[a-1]||""),wb=el("button","rs-wb","শব্দে শব্দে অর্থ"),wh=el("div","rs-ww");
   wb.type="button";
   t.split(" ").forEach((x,i)=>{if(i)tx.appendChild(document.createTextNode(" "));if(i===w-1){const m=el("mark",null,x);tx.appendChild(m)}else tx.appendChild(document.createTextNode(x))});
   let wl=false;wb.onclick=async()=>{wh.classList.toggle("on");if(wl)return;wl=true;wh.textContent="লোড হচ্ছে…";
    try{const m=((await chunk("w",s))||[])[a-1].split("|");wh.textContent="";t.split(" ").forEach((x,i)=>{const c=el("div","rs-wc"+(i===w-1?" hl":"")),ar=el("div","rs-wa rs-ar",x),b=el("div","rs-wm",m[i]||"");c.append(ar,b);wh.appendChild(c)})}catch(e){wh.textContent="লোড করা যায়নি — আবার চাপুন";wl=false}};
   box.append(rf,tx,tb,wb,wh);host.insertBefore(box,more)}
  more.disabled=false;more.style.display=shown<refs.length?"":"none";more.textContent="আরও আয়াত দেখান ("+bn2(refs.length-shown)+" বাকি)"};
 host.appendChild(more);more.onclick=add;add()}
function card(it,exact){const r=it.r,c=el("div","rs-root"),h=el("div","rs-rh"),
 l=el("div","rs-rl rs-ar"),
 m=el("div","rs-rm"),ch=el("div","rs-ch","▾");
 m.innerHTML="<b>"+bn2(r.n)+"</b> বার এসেছে · <b>"+bn2(r.forms.length)+"</b>টি রূপ";
 [...r.r].forEach(x=>l.appendChild(el("span",null,x)));h.append(l,m,ch);const fb=el("div","rs-forms");c.append(h,fb);let built=false;
 const list=(exact||it.sc>=60||!it.mf)?r.forms:it.mf;
 h.onclick=()=>{c.classList.toggle("open");if(built)return;built=true;
  [...list].sort((a,b)=>b.refs.length-a.refs.length).forEach(f=>{const row=el("div","rs-f"),w=el("div"),fw=el("div","rs-fw rs-ar",f.t),fm=el("div","rs-fm",f.m||""),fl=el("div","rs-fl rs-ar",f.l||""),ct=el("div","rs-fc",bn2(f.refs.length)),vh=el("div","rs-v");
   w.append(fw,fm,fl);row.append(w,ct);let vb=false;
   row.onclick=()=>{row.classList.toggle("open");if(vb)return;vb=true;verses(vh,f.refs)};
   fb.append(row,vh)});
  {const f0=fb.querySelector(".rs-f");f0&&f0.click()}
  if(it.mf&&it.sc<60&&list.length<r.forms.length){const all=el("button","rs-more","এই রুটের সব রূপ দেখান ("+bn2(r.forms.length)+")");all.type="button";all.onclick=()=>{fb.innerHTML="";built=false;it.sc=100;c.classList.remove("open");h.onclick()};fb.append(all)}};
 return c}
let tm=0;
async function run(){const raw=$("rsQ").value,q=nz(raw),out=$("rsOut"),info=$("rsInfo");out.innerHTML="";
 const bq=raw.trim();
 if(!q&&/[\u0980-\u09FF]/.test(bq)){if(bq.length<2){info.textContent="কমপক্ষে ২টি অক্ষর লিখুন";return}
  await loadRoots();const rb=searchBn(bq);if(!rb.length){info.textContent="এই বাংলা অর্থে কিছু পাওয়া যায়নি — অন্য শব্দ লিখে দেখুন (যেমন: কিতাব, জ্ঞান, দয়া)";return}
  info.textContent="বাংলা অর্থে "+bn2(rb.length)+"টি রুট পাওয়া গেছে"+(rb.length>40?" (প্রথম ৪০টি)":"");
  rb.slice(0,40).forEach((it,i)=>{const c=card(it,!1);out.appendChild(c);if(rb.length<=3)c.querySelector(".rs-rh").click()});return}
 if(!q){info.textContent="রুটে চাপ দিন — রূপ ও বাংলা অর্থসহ আয়াত দেখাবে";return}
 if(q.length<2){info.textContent="কমপক্ষে ২টি হরফ লিখুন";return}
 await loadRoots();const res=search(q);
 if(!res.length){info.textContent="কিছু পাওয়া যায়নি — হরফ বদলে বা কম লিখে দেখুন";return}
 const LIM=40;info.textContent=bn2(res.length)+"টি রুট পাওয়া গেছে"+(res[0].loose?" (হুবহু মেলেনি, কাছাকাছি বানান ধরে খোঁজা হয়েছে)":"")+(res.length>LIM?" (প্রথম "+bn2(LIM)+"টি দেখানো হচ্ছে; আরও হরফ লিখে সংকীর্ণ করুন)":"");
 res.slice(0,LIM).forEach((it,i)=>{const c=card(it,it.sc===100);out.appendChild(c);if(res.length<=3||i===0&&it.sc>=80)c.querySelector(".rs-rh").click()})}
function init(){const q=$("rsQ"),pad=$("rsPad");
 "ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ء ة ى أ إ آ ؤ ئ".split(" ").forEach(ch=>{const b=el("button",null,ch);b.type="button";b.onclick=()=>{q.value+=ch;go()};pad.appendChild(b)});
 const bs=el("button",null,"⌫");bs.type="button";bs.onclick=()=>{q.value=q.value.slice(0,-1);go()};pad.appendChild(bs);
 $("rsKb").onclick=()=>pad.classList.toggle("on");
 $("rsX").onclick=()=>{q.value="";go();q.focus()};
 q.oninput=()=>{clearTimeout(tm);tm=setTimeout(go,200)};
 const go=()=>run().catch(e=>{console.error(e);$("rsInfo").textContent="ডেটা লোড করা যায়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন"});
