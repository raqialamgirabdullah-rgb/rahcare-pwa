<link href="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.css?v=39" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"><script>addEventListener("pageshow",e=>e.persisted&&location.reload())</script><style>
body{background:var(--bg);margin:0;padding:10px 10px 96px;font-family:var(--font-main)}
.rs-box{background:var(--card-bg);border-radius:8px;max-width:640px;margin:auto;padding:16px;box-shadow:var(--shadow-card)}
.rs-title{color:var(--primary);border-bottom:2px solid var(--border-light);margin:0 0 6px;padding-bottom:10px}
.rs-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 12px}
.rs-ar{font-family:"Amiri","Noto Naskh Arabic","Scheherazade New",serif;direction:rtl}
.rs-bar{display:flex;gap:6px;align-items:center}
#rsQ{flex:1;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:22px;text-align:right;direction:rtl;background:var(--card-bg);color:inherit;min-width:0}
.rs-ib{border:1px solid var(--border);background:var(--card-bg);color:var(--primary);border-radius:8px;padding:0 11px;height:46px;font-size:18px;cursor:pointer}
.rs-pad{display:none;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;direction:rtl}
.rs-pad.on{display:grid}
.rs-pad button{border:1px solid var(--border-light);background:var(--card-bg);color:inherit;border-radius:7px;padding:7px 0;font-size:21px;cursor:pointer;font-family:"Amiri","Noto Naskh Arabic",serif}
.rs-pad button:active{background:var(--primary);color:#fff}
.rs-info{color:var(--text-muted);font-size:12.5px;margin:10px 2px}
.rs-root{border:1px solid var(--border-light);border-radius:10px;margin-top:8px;overflow:hidden}
.rs-rh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.rs-rl{font-size:28px;color:var(--primary);font-weight:700;letter-spacing:4px;min-width:84px;text-align:center}
.rs-rm{flex:1;font-size:12.5px;color:var(--text-muted);line-height:1.5}
.rs-rm b{color:inherit}
.rs-ch{color:var(--text-muted);font-size:13px}
.rs-forms{display:none;border-top:1px solid var(--border-light);padding:6px 10px 10px}
.rs-root.open .rs-forms{display:block}
.rs-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px dashed var(--border-light);cursor:pointer}
.rs-fw{font-size:22px;direction:rtl}
.rs-fl{font-size:12px;color:var(--text-muted)}
.rs-fc{font-size:12px;color:#fff;background:var(--primary);border-radius:999px;padding:2px 9px;white-space:nowrap}
.rs-v{display:none;padding:4px 2px 8px}
.rs-f.open+.rs-v{display:block}
.rs-vi{border-radius:8px;background:var(--bg);padding:8px 10px;margin-top:6px}
.rs-vr{font-size:11.5px;color:var(--text-muted);margin-bottom:3px}
.rs-vt{font-size:22px;line-height:2.1;direction:rtl;text-align:right}
.rs-vt mark{background:var(--primary);color:#fff;border-radius:5px;padding:0 4px}
.rs-more{display:block;margin:8px auto 0;border:1px solid var(--border);background:var(--card-bg);color:var(--primary);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.rs-foot{color:var(--text-muted);font-size:11px;margin-top:14px;text-align:center;line-height:1.6}
</style><div class="rs-box" id="rsBox" style="visibility:hidden"><h3 class="rs-title">🔬 Research</h3><p class="rs-sub">কুরআনের রুট ওয়ার্ড (জযর) সার্চ — যেকোনো আরবি হরফ, রুট বা শব্দ লিখুন (যেমন: كتب, علم, الصلاة)</p><div class="rs-bar"><button class="rs-ib" id="rsKb" type="button" title="আরবি কীবোর্ড">⌨</button><input id="rsQ" class="rs-ar" type="search" dir="rtl" lang="ar" placeholder="ابحث بالحروف…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="rs-ib" id="rsX" type="button" title="মুছুন">✕</button></div><div class="rs-pad" id="rsPad"></div><div class="rs-info" id="rsInfo">ডেটা লোড হচ্ছে…</div><div id="rsOut"></div><div class="rs-foot">ডেটা: Quranic Arabic Corpus (Kais Dukes) — mustafa0x/quran-morphology, GNU GPL<br>রুট নির্ণয় মেশিন-ভিত্তিক গবেষণা-ডেটা; গুরুত্বপূর্ণ সিদ্ধান্তের আগে আলেম/কিতাব দেখে যাচাই করুন।</div></div>
<script type="module">
import{db,auth,requireAuth}from"https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/common.js?v=30";
import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const BASE="https://raqialamgirabdullah-rgb.github.io/rahcare-pwa/",DV="1",$=i=>document.getElementById(i);
const SN="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const MARKS=/[\u0610-\u061A\u064B-\u065F\u06D6-\u06ED\u0640]/g;
const nz=(s,dag)=>String(s||"").replace(/\u0670/g,dag?"ا":"").replace(MARKS,"").replace(/[أإآٱ]/g,"ا").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A]/g,"");
const lk=s=>nz(s).replace(/[اويء]/g,"");
const lessAl=s=>s.length>3&&s.startsWith("ال")?s.slice(2):s;
let R=null,AY=null,ayP=null;
const el=(t,c,x)=>{const e=document.createElement(t);c&&(e.className=c);x!=null&&(e.textContent=x);return e};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
async function loadRoots(){if(R)return R;const j=await(await fetch(BASE+"quran-roots.json?v="+DV)).json();
R=j.roots.map(([r,fs])=>{const forms=fs.map(([t,l,refs])=>({t,l,refs:refs.split(","),k1:nz(t,1),k2:nz(t),k3:lk(t),kl:nz(l)}));return{r,rn:nz(r),r3:lk(r),forms,n:forms.reduce((a,f)=>a+f.refs.length,0)}});return R}
function loadAyat(){return AY?Promise.resolve(AY):(ayP||(ayP=fetch(BASE+"quran-ayat.json?v="+DV).then(r=>r.json()).then(j=>AY=j)))}
function search(q){const out=[];for(const r of R){let sc=0,mf=null;
 if(r.rn===q)sc=100;
 else{const ex=r.forms.filter(f=>f.k1===q||f.k2===q||lessAl(f.k1)===q||lessAl(f.k2)===q);
  if(ex.length){sc=80;mf=ex}
  else if(q.length>=2&&r.rn.includes(q))sc=60;
  else if(q.length>=2){const p=r.forms.filter(f=>f.k1.includes(q)||f.k2.includes(q));if(p.length){sc=40;mf=p}else{const l=r.forms.filter(f=>f.kl.includes(q));if(l.length){sc=30;mf=l}}}}
 if(sc)out.push({r,sc,mf})}
 if(!out.length){const q3=lk(q);if(q3.length>=2)for(const r of R){let sc=0,mf=null;
  if(r.r3===q3)sc=50;else{const p=r.forms.filter(f=>f.k3.includes(q3));if(p.length){sc=35;mf=p}}
  if(sc)out.push({r,sc,mf,loose:1})}}
 return out.sort((a,b)=>b.sc-a.sc||b.r.n-a.r.n)}
function verses(host,refs,hl){let shown=0;const step=15;
 const more=el("button","rs-more","আরও আয়াত দেখান");more.type="button";
 const add=async()=>{const ay=await loadAyat();const end=Math.min(refs.length,shown+step);
  for(;shown<end;shown++){const [s,a,w]=refs[shown].split(":").map(Number),t=(ay[s-1]||[])[a-1];if(t==null)continue;
   const box=el("div","rs-vi"),rf=el("div","rs-vr","سورة "+SN[s-1]+" — "+bn(s)+":"+bn(a)),tx=el("div","rs-vt rs-ar");
   t.split(" ").forEach((x,i)=>{if(i)tx.appendChild(document.createTextNode(" "));if(i===w-1){const m=el("mark",null,x);tx.appendChild(m)}else tx.appendChild(document.createTextNode(x))});
   box.append(rf,tx);host.insertBefore(box,more)}
  more.style.display=shown<refs.length?"":"none";more.textContent="আরও আয়াত দেখান ("+bn(refs.length-shown)+" বাকি)"};
 host.appendChild(more);more.onclick=add;add()}
function card(it,exact){const r=it.r,c=el("div","rs-root"),h=el("div","rs-rh"),
 l=el("div","rs-rl rs-ar",r.r.split("").join(" ")),
 m=el("div","rs-rm"),ch=el("div","rs-ch","▾");
 m.innerHTML="<b>"+bn(r.n)+"</b> বার এসেছে · <b>"+bn(r.forms.length)+"</b>টি রূপ";
 h.append(l,m,ch);const fb=el("div","rs-forms");c.append(h,fb);let built=false;
 const list=(exact||it.sc>=60||!it.mf)?r.forms:it.mf;
 h.onclick=()=>{c.classList.toggle("open");if(built)return;built=true;
  [...list].sort((a,b)=>b.refs.length-a.refs.length).forEach(f=>{const row=el("div","rs-f"),w=el("div"),fw=el("div","rs-fw rs-ar",f.t),fl=el("div","rs-fl rs-ar",f.l||""),ct=el("div","rs-fc",bn(f.refs.length)),vh=el("div","rs-v");
   w.append(fw,fl);row.append(w,ct);let vb=false;
   row.onclick=()=>{row.classList.toggle("open");if(vb)return;vb=true;verses(vh,f.refs)};
   fb.append(row,vh)});
  if(it.mf&&it.sc<60&&list.length<r.forms.length){const all=el("button","rs-more","এই রুটের সব রূপ দেখান ("+bn(r.forms.length)+")");all.type="button";all.onclick=()=>{fb.innerHTML="";built=false;it.sc=100;c.classList.remove("open");h.onclick()};fb.append(all)}};
 return c}
let tm=0;
async function run(){const raw=$("rsQ").value,q=nz(raw),out=$("rsOut"),info=$("rsInfo");out.innerHTML="";
 if(!q){info.textContent="আরবি হরফ লিখুন বা ⌨ চেপে কীবোর্ড থেকে বাছুন";return}
 if(q.length<2){info.textContent="কমপক্ষে ২টি হরফ লিখুন";return}
 await loadRoots();const res=search(q);
 if(!res.length){info.textContent="কিছু পাওয়া যায়নি — হরফ বদলে বা কম লিখে দেখুন";return}
 const LIM=40;info.textContent=bn(res.length)+"টি রুট পাওয়া গেছে"+(res[0].loose?" (হুবহু মেলেনি, কাছাকাছি বানান ধরে খোঁজা হয়েছে)":"")+(res.length>LIM?" (প্রথম "+bn(LIM)+"টি দেখানো হচ্ছে; আরও হরফ লিখে সংকীর্ণ করুন)":"");
 res.slice(0,LIM).forEach((it,i)=>{const c=card(it,it.sc===100);out.appendChild(c);if(res.length<=3||i===0&&it.sc>=80)c.querySelector(".rs-rh").click()})}
function init(){const q=$("rsQ"),pad=$("rsPad");
 "ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ء ة ى أ إ آ ؤ ئ".split(" ").forEach(ch=>{const b=el("button",null,ch);b.type="button";b.onclick=()=>{q.value+=ch;go()};pad.appendChild(b)});
 const bs=el("button",null,"⌫");bs.type="button";bs.onclick=()=>{q.value=q.value.slice(0,-1);go()};pad.appendChild(bs);
 $("rsKb").onclick=()=>pad.classList.toggle("on");
 $("rsX").onclick=()=>{q.value="";go();q.focus()};
 q.oninput=()=>{clearTimeout(tm);tm=setTimeout(go,200)};
 const go=()=>run().catch(e=>{console.error(e);$("rsInfo").textContent="ডেটা লোড করা যায়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন"});
 go();loadRoots().then(()=>{if(!q.value)$("rsInfo").textContent="আরবি হরফ লিখুন বা ⌨ চেপে কীবোর্ড থেকে বাছুন ("+bn(R.length)+"টি রুট)"}).catch(()=>{})}
/* শুধু ম্যানেজমেন্ট ইউজার (users/{uid} আছে) দেখতে পারবেন; ওয়ার্কার বা অন্য কেউ হলে সরিয়ে দেওয়া হয় */
requireAuth(async u=>{let ok=!1;try{ok=(await getDoc(doc(db,"users",u.uid))).exists()}catch(e){}if(!ok)return void location.replace("https://rahcare.blogspot.com/p/dashboard.html");$("rsBox").style.visibility="visible";init()});
</script>
